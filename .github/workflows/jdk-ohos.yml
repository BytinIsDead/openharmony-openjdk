#
# Cross-builds OpenJDK 21/25 for x86_64-linux-ohos and aarch64-linux-ohos.
# Runtime zips are release artifacts, never repository contents. Run manually
# with publish=true to (re)populate the release consumed by MC4HOS.

name: OpenJDK OHOS runtimes

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish runtime zips and catalog to a GitHub release
        type: boolean
        default: false
      release_tag:
        description: Release tag to create/update when publishing
        type: string
        default: jdk-ohos-v1
      only:
        description: 'Diagnostics only: build a single target, e.g. "21-aarch64"'
        type: string
        default: ""
  push:
    tags:
      - "jdk-ohos-v*"

permissions:
  contents: write

concurrency:
  group: jdk-ohos-${{ github.ref }}
  cancel-in-progress: false

env:
  HOS_TOOLS_PRIMARY: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/7ff999061d57e9a542fe7e02fc920961e67a163b/commandline-tools-linux-x64-6.1.1.280.zip
  HOS_TOOLS_FALLBACK: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.1.1.280.zip
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || 'jdk-ohos-v1' }}

jobs:
  build:
    name: JDK ${{ matrix.major }} / ${{ matrix.arch }}
    if: ${{ inputs.only == '' || inputs.only == format('{0}-{1}', matrix.major, matrix.arch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - major: 21
            arch: x86_64
          - major: 21
            arch: aarch64
          - major: 25
            arch: x86_64
          - major: 25
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.major }}

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf build-essential clang zip unzip file libasound2-dev
          # Ubuntu 25.10+ ships uutils coreutils by default; the OpenJDK build
          # probes for GNU date and silently takes a BSD code path otherwise.
          if ! date --version 2>/dev/null | grep -q "GNU coreutils"; then
            sudo apt-get install -y --no-install-recommends coreutils-from-gnu || true
            if ! date --version 2>/dev/null | grep -q "GNU coreutils"; then
              sudo apt-get remove -y --allow-remove-essential coreutils-from-uutils
            fi
          fi
          date --version | head -1

      - name: Cache HarmonyOS toolchain zip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/commandline-tools.zip
          key: hos-tools-6.1.1.280-v1

      - name: Download HarmonyOS command line tools (public, no auth)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          CANDIDATES=(
            "${{ vars.HOS_TOOLS_URL }}"
            "$HOS_TOOLS_PRIMARY"
            "$HOS_TOOLS_FALLBACK"
          )
          for url in "${CANDIDATES[@]}"; do
            [ -n "$url" ] || continue
            echo "Trying: $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
                 -o ~/commandline-tools.zip "$url"; then
              echo "Downloaded from: $url"
              exit 0
            fi
            echo "Candidate failed, trying next…"
          done
          echo "::error::All commandline-tools sources failed."
          exit 1

      - name: Unpack toolchain and locate the native SDK
        run: |
          rm -rf ~/hos-tools
          mkdir -p ~/hos-tools
          unzip -q ~/commandline-tools.zip -d ~/hos-tools
          CMAKE=$(find ~/hos-tools -path "*/native/build/cmake/ohos.toolchain.cmake" -print -quit)
          if [ -z "$CMAKE" ]; then
            echo "::error::native/build/cmake/ohos.toolchain.cmake not found in toolchain zip"
            exit 1
          fi
          OHOS_NATIVE=$(cd "$(dirname "$CMAKE")/../.." && pwd)
          for required in "$OHOS_NATIVE/sysroot" "$OHOS_NATIVE/llvm/bin/clang"; do
            if [ ! -e "$required" ]; then
              echo "::error::unexpected SDK layout: missing $required"
              exit 1
            fi
          done
          echo "OHOS_NATIVE=$OHOS_NATIVE" >> "$GITHUB_ENV"
          echo "=== OpenJDK prerequisites ==="
          "$OHOS_NATIVE/llvm/bin/clang" --version | head -1
          ls "$OHOS_NATIVE/sysroot/usr/lib/${{ matrix.arch }}-linux-ohos/libc.so"

      - name: Fetch pinned build inputs (patches + stubs)
        run: |
          python3 scripts/fetch_inputs.py \
            --major "${{ matrix.major }}" \
            --dest "$RUNNER_TEMP/jdk-inputs-${{ matrix.major }}-${{ matrix.arch }}"

      - name: Cross-build and package
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
        run: |
          ulimit -s 65536
          bash scripts/build_ohos_jre.sh \
            --major "${{ matrix.major }}" \
            --arch "${{ matrix.arch }}" \
            --native "$OHOS_NATIVE" \
            --inputs "$RUNNER_TEMP/jdk-inputs-${{ matrix.major }}-${{ matrix.arch }}" \
            --work "$RUNNER_TEMP/jdk-work-${{ matrix.major }}-${{ matrix.arch }}" \
            --output "$GITHUB_WORKSPACE/dist"

      - name: Collect build logs on failure
        if: failure()
        run: |
          mkdir -p dist/logs
          cp "$RUNNER_TEMP"/jdk-work-${{ matrix.major }}-${{ matrix.arch }}/configure-*.log dist/logs/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/jdk-work-${{ matrix.major }}-${{ matrix.arch }}/build-*.log dist/logs/ 2>/dev/null || true
          WORK="$RUNNER_TEMP/jdk-work-${{ matrix.major }}-${{ matrix.arch }}"
          {
            echo "ulimit -s: $(ulimit -s)"
            find "$WORK" -type f -name adlc | while read -r tool; do
              echo "=== $tool"
              file "$tool"
              ldd "$tool" 2>&1 | head -20
            done
            echo "=== exec logs"
            find "$WORK" -name '_adlc_run_exec.log' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
            echo "=== make-support failure logs"
            find "$WORK" -path '*/make-support/failure-logs/*' -exec sh -c 'echo "--- $1"; head -40 "$1"' _ {} \;
            TOOL=$(find "$WORK" -path '*/hotspot/variant-server/tools/adlc/adlc' -type f | head -1)
            SRC=$(find "$WORK" -name 'all-ad-src.ad' -path '*/variant-server/*' | head -1)
            if [ -n "$TOOL" ] && [ -n "$SRC" ]; then
              cp "$TOOL" dist/logs/adlc-ci || true
              cp "$SRC" dist/logs/all-ad-src.ad || true
              sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
              gdb -batch -ex run -ex 'bt 25' -ex 'info registers rip' \
                --args "$TOOL" -q -T -DLINUX=1 -D_GNU_SOURCE=1 -g -DAARCH64=1 \
                  -D_LP64=1 -DNDEBUG -DPRODUCT "$SRC" \
                  -c/tmp/ad_aarch64.cpp -h/tmp/ad_aarch64.hpp \
                  -a/tmp/dfa_aarch64.cpp -v/tmp/adGlobals_aarch64.hpp
            fi
          } > dist/logs/adlc-diagnostics.txt 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-jdk${{ matrix.major }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish runtime release
    needs: build
    if: ${{ (inputs.publish || startsWith(github.ref, 'refs/tags/jdk-ohos-v')) && inputs.only == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge catalogs and checksums
        run: |
          python3 - <<'PY'
          import json, pathlib
          entries = []
          for path in sorted(pathlib.Path("dist").glob("runtime-catalog-*.json")):
              entries.extend(json.loads(path.read_text(encoding="utf-8")))
          if len(entries) != 4:
              raise SystemExit(f"expected 4 catalog entries, got {len(entries)}")
          pathlib.Path("dist/runtime-catalog.json").write_text(
              json.dumps(entries, indent=2) + "\n", encoding="utf-8")
          PY
          cat dist/*.sha256 > dist/SHA256SUMS
          cat dist/runtime-catalog.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="OpenJDK x86_64 and aarch64 runtime packs for HarmonyOS/OpenHarmony.

          Built from the pinned upstream commits and OHOS patch series recorded in
          build-inputs.lock.json. OpenJDK is GPLv2 with the Classpath Exception;
          each pack preserves the upstream license files and the exact source
          identities in MC4HOS-RUNTIME-NOTICE.txt."
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "OpenJDK OHOS runtimes ($RELEASE_TAG)" \
              --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/*.zip dist/*.sha256 dist/runtime-catalog.json dist/SHA256SUMS \
            --clobber
